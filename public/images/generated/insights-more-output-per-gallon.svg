<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
  <title id="title">More output per gallon workflow visual</title>
  <desc id="desc">A text-free teaser visual showing ethanol reuse increasing value per gallon before recovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071315"/>
      <stop offset="0.58" stop-color="#123134"/>
      <stop offset="1" stop-color="#101816"/>
    </linearGradient>
    <linearGradient id="value" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13a7c7"/>
      <stop offset="1" stop-color="#91c83e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dcebea" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0v52" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1440" height="840" fill="url(#bg)"/>
  <rect width="1440" height="840" fill="url(#grid)"/>
  <circle cx="1190" cy="150" r="320" fill="#13a7c7" opacity="0.14"/>
  <circle cx="180" cy="720" r="300" fill="#91c83e" opacity="0.11"/>

  <g transform="translate(840 160) scale(0.5)" filter="url(#shadow)">
    <rect width="1200" height="540" rx="46" fill="url(#glass)"/>
    <g transform="translate(88 92)">
      <rect width="450" height="72" rx="36" fill="#e1ecea"/>
      <rect width="142" height="72" rx="36" fill="#13a7c7"/>
      <circle cx="570" cy="36" r="38" fill="#102528"/>
      <path d="M548 36h32" stroke="#91c83e" stroke-width="9" stroke-linecap="round"/>
      <path d="M574 16l32 20-32 20z" fill="#91c83e"/>
      <rect x="660" width="450" height="72" rx="36" fill="#e1ecea"/>
      <rect x="660" width="390" height="72" rx="36" fill="url(#value)"/>
    </g>

    <g transform="translate(130 248)">
      <path d="M0 150C110 24 238 24 350 150S590 276 700 150 940 24 1050 150" fill="none" stroke="#13a7c7" stroke-width="15" stroke-linecap="round" opacity="0.22"/>
      <path d="M0 150C110 72 238 72 350 150S590 228 700 150 940 72 1050 150" fill="none" stroke="#91c83e" stroke-width="15" stroke-linecap="round" opacity="0.26"/>
      <g fill="#13a7c7" opacity="0.6">
        <circle cx="120" cy="104" r="14"/>
        <circle cx="270" cy="190" r="11"/>
        <circle cx="480" cy="114" r="16"/>
        <circle cx="680" cy="188" r="13"/>
        <circle cx="900" cy="114" r="15"/>
      </g>
      <g fill="#91c83e" opacity="0.7">
        <circle cx="206" cy="150" r="9"/>
        <circle cx="410" cy="152" r="10"/>
        <circle cx="774" cy="150" r="9"/>
        <circle cx="1010" cy="150" r="11"/>
      </g>
    </g>
  </g>
</svg>
