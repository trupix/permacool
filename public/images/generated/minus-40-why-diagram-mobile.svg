<svg width="390" height="1180" viewBox="0 0 390 1180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Why Celsius and Fahrenheit meet at minus forty on mobile</title>
  <desc id="desc">A stacked mobile diagram explaining degree size, offset, convergence, and the equation that leads to negative forty.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071113"/>
      <stop offset="0.55" stop-color="#122629"/>
      <stop offset="1" stop-color="#111c16"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="390" height="1180" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#ffffff">
    <path d="M0 100H390M0 250H390M0 400H390M0 550H390M0 700H390M0 850H390M0 1000H390"/>
    <path d="M65 0V1180M130 0V1180M195 0V1180M260 0V1180M325 0V1180"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="20" y="36" font-size="11" font-weight="900" letter-spacing="2.5" fill="#84edfd">WHY THIS HAPPENS</text>
    <text x="20" y="70" font-size="22" font-weight="900" fill="#ffffff">Different degree size.</text>
    <text x="20" y="96" font-size="22" font-weight="900" fill="#ffffff">Different zero. One crossing.</text>

    <g transform="translate(16 124)">
      <rect width="358" height="242" rx="8" fill="#071113" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect width="358" height="5" fill="#74e8ff"/>
      <text x="20" y="37" font-size="11" font-weight="900" letter-spacing="2" fill="#84edfd">01  SCALE SIZE</text>
      <text x="20" y="68" font-size="21" font-weight="900" fill="#ffffff">The degree steps</text>
      <text x="20" y="92" font-size="21" font-weight="900" fill="#ffffff">are different.</text>
      <text x="20" y="119" font-size="13" font-weight="800" fill="#afc0be">1 Celsius degree equals</text>
      <text x="20" y="138" font-size="13" font-weight="800" fill="#afc0be">1.8 Fahrenheit degrees.</text>
      <g transform="translate(20 148)">
        <text x="0" y="10" font-size="10" font-weight="900" fill="#9aefff">1&#176;C</text>
        <rect x="0" y="16" width="318" height="25" rx="5" fill="#13a7c7" fill-opacity="0.14" stroke="#74e8ff" stroke-width="1.5"/>
        <text x="0" y="58" font-size="10" font-weight="900" fill="#eaf2d2">1.8&#176;F</text>
        <rect x="0" y="64" width="318" height="25" rx="5" fill="#91c83e" fill-opacity="0.12" stroke="#a8d65c" stroke-width="1.5"/>
        <path d="M177 67V86" stroke="#ffffff" stroke-opacity="0.4" stroke-dasharray="3 4"/>
        <text x="91" y="81" text-anchor="middle" font-size="9" font-weight="900" fill="#ffffff">1&#176;F</text>
        <text x="248" y="81" text-anchor="middle" font-size="9" font-weight="900" fill="#ffffff">0.8&#176;F</text>
      </g>
    </g>

    <g transform="translate(16 382)">
      <rect width="358" height="242" rx="8" fill="#071113" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect width="358" height="5" fill="#a8d65c"/>
      <text x="20" y="37" font-size="11" font-weight="900" letter-spacing="2" fill="#dce98e">02  OFFSET</text>
      <text x="20" y="68" font-size="21" font-weight="900" fill="#ffffff">The zero points</text>
      <text x="20" y="92" font-size="21" font-weight="900" fill="#ffffff">do not line up.</text>
      <text x="20" y="119" font-size="13" font-weight="800" fill="#afc0be">The scales start 32 units apart</text>
      <text x="20" y="138" font-size="13" font-weight="800" fill="#afc0be">at water's freezing point.</text>
      <g transform="translate(20 153)">
        <rect width="318" height="70" rx="6" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.16"/>
        <path d="M78 35H240" stroke="#ffffff" stroke-opacity="0.28" stroke-dasharray="5 6"/>
        <circle cx="78" cy="35" r="24" fill="#13a7c7" fill-opacity="0.2" stroke="#74e8ff" stroke-width="2"/>
        <circle cx="240" cy="35" r="24" fill="#91c83e" fill-opacity="0.18" stroke="#a8d65c" stroke-width="2"/>
        <text x="78" y="41" text-anchor="middle" font-size="15" font-weight="900" fill="#ffffff">0&#176;C</text>
        <text x="240" y="41" text-anchor="middle" font-size="15" font-weight="900" fill="#ffffff">32&#176;F</text>
        <text x="159" y="64" text-anchor="middle" font-size="9" font-weight="900" letter-spacing="1.5" fill="#afc0be">SAME WATER</text>
      </g>
    </g>

    <g transform="translate(16 640)">
      <rect width="358" height="242" rx="8" fill="#071113" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect width="358" height="5" fill="#ffffff"/>
      <text x="20" y="37" font-size="11" font-weight="900" letter-spacing="2" fill="#ffffff">03  THE CONVERGENCE</text>
      <text x="20" y="68" font-size="21" font-weight="900" fill="#ffffff">Different starts.</text>
      <text x="20" y="92" font-size="21" font-weight="900" fill="#ffffff">Different speeds.</text>
      <text x="20" y="119" font-size="13" font-weight="800" fill="#afc0be">Fahrenheit changes faster as</text>
      <text x="20" y="138" font-size="13" font-weight="800" fill="#afc0be">temperatures rise, so the lines</text>
      <text x="20" y="157" font-size="13" font-weight="800" fill="#afc0be">meet once below zero.</text>
      <g transform="translate(20 169)">
        <rect width="318" height="55" rx="6" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.14"/>
        <path d="M18 45H300M38 50V9" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.5"/>
        <path d="M18 44L300 18" fill="none" stroke="#74e8ff" stroke-width="4" stroke-linecap="round"/>
        <path d="M88 52L150 33L232 5" fill="none" stroke="#a8d65c" stroke-width="4" stroke-linecap="round"/>
        <circle cx="150" cy="33" r="6" fill="#ffffff" filter="url(#glow)"/>
        <text x="160" y="50" font-size="10" font-weight="900" fill="#ffffff">&#8722;40</text>
      </g>
    </g>

    <g transform="translate(16 898)">
      <rect width="358" height="250" rx="8" fill="#050b0c" stroke="#ffffff" stroke-opacity="0.17"/>
      <text x="20" y="34" font-size="11" font-weight="900" letter-spacing="2" fill="#84edfd">SET THE READINGS EQUAL</text>
      <g transform="translate(20 65)" font-size="18" font-weight="900">
        <text x="0" y="0" fill="#ffffff">F = C</text>
        <text x="0" y="34" fill="#ffffff">C = 1.8C + 32</text>
        <text x="0" y="68" fill="#ffffff">&#8722;0.8C = 32</text>
        <text x="0" y="102" fill="#74e8ff">C = &#8722;40</text>
      </g>
      <rect x="20" y="184" width="318" height="48" rx="6" fill="#10282a" stroke="#74e8ff" stroke-opacity="0.5" stroke-width="2"/>
      <text x="179" y="215" text-anchor="middle" font-size="24" font-weight="900" fill="#ffffff">
        <tspan fill="#74e8ff">&#8722;40&#176;C</tspan>
        <tspan fill="#ffffff"> = </tspan>
        <tspan fill="#a8d65c">&#8722;40&#176;F</tspan>
      </text>
    </g>
  </g>
</svg>
