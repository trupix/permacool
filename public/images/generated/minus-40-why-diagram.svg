<svg width="1440" height="1160" viewBox="0 0 1440 1160" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Why Fahrenheit and Celsius meet at minus forty</title>
  <desc id="desc">A spaced diagram showing that Celsius and Fahrenheit meet at minus forty because of scale size, offset, and convergence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071011"/>
      <stop offset="0.58" stop-color="#162523"/>
      <stop offset="1" stop-color="#0c1718"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74e8ff"/>
      <stop offset="1" stop-color="#13a7c7"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8e86a"/>
      <stop offset="1" stop-color="#91c83e"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1440" height="1160" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#ffffff">
    <path d="M76 150H1364M76 310H1364M76 470H1364M76 630H1364M76 790H1364M76 950H1364"/>
    <path d="M180 92V1068M380 92V1068M580 92V1068M780 92V1068M980 92V1068M1180 92V1068"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="86" font-size="24" font-weight="900" fill="#78e4f4">Why this happens</text>
    <text x="90" y="138" font-size="46" font-weight="900" fill="#ffffff">Different degree size + offset = one cold crossing.</text>

    <g transform="translate(90 190)">
      <rect width="1260" height="200" rx="24" fill="#0b1516" stroke="#ffffff" stroke-opacity="0.16"/>
      <circle cx="72" cy="72" r="34" fill="url(#lime)" filter="url(#glow)"/>
      <text x="72" y="81" text-anchor="middle" font-size="24" font-weight="900" fill="#071011">01</text>
      <text x="134" y="68" font-size="34" font-weight="900" fill="#ffffff">Scale Size</text>
      <text x="134" y="112" font-size="25" font-weight="900" fill="#dbe9da">A Celsius degree is 1.8 times larger than a Fahrenheit degree.</text>
      <text x="134" y="150" font-size="21" font-weight="800" fill="#aebcba">That means the two scales do not climb at the same rate.</text>

      <g transform="translate(872 62)">
        <path d="M0 0H300" stroke="#91c83e" stroke-width="14" stroke-linecap="round"/>
        <path d="M0 66H167" stroke="#74e8ff" stroke-width="14" stroke-linecap="round"/>
        <text x="320" y="8" font-size="22" font-weight="900" fill="#91c83e">1°C</text>
        <text x="188" y="74" font-size="22" font-weight="900" fill="#74e8ff">1°F</text>
      </g>
    </g>

    <g transform="translate(90 430)">
      <rect width="1260" height="200" rx="24" fill="#0b1516" stroke="#ffffff" stroke-opacity="0.16"/>
      <circle cx="72" cy="72" r="34" fill="url(#cyan)" filter="url(#glow)"/>
      <text x="72" y="81" text-anchor="middle" font-size="24" font-weight="900" fill="#071011">02</text>
      <text x="134" y="68" font-size="34" font-weight="900" fill="#ffffff">Offset</text>
      <text x="134" y="112" font-size="25" font-weight="900" fill="#d4eeef">The scales start 32 units apart at the freezing point of water.</text>
      <text x="134" y="150" font-size="21" font-weight="800" fill="#aebcba">At the same physical temperature, water freezes at 0°C and 32°F.</text>

      <g transform="translate(876 54)">
        <rect width="292" height="92" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="146" y="59" text-anchor="middle" font-size="38" font-weight="900" fill="#ffffff">0°C = 32°F</text>
      </g>
    </g>

    <g transform="translate(90 670)">
      <rect width="1260" height="210" rx="24" fill="#0b1516" stroke="#ffffff" stroke-opacity="0.16"/>
      <circle cx="72" cy="74" r="34" fill="#ffffff" opacity="0.95" filter="url(#glow)"/>
      <text x="72" y="83" text-anchor="middle" font-size="24" font-weight="900" fill="#071011">03</text>
      <text x="134" y="70" font-size="34" font-weight="900" fill="#ffffff">The Convergence</text>
      <text x="134" y="114" font-size="25" font-weight="900" fill="#d4eeef">Because the Fahrenheit reading changes faster as Celsius rises,</text>
      <text x="134" y="150" font-size="25" font-weight="900" fill="#d4eeef">the two straight lines meet once in the negative temperatures.</text>

      <g transform="translate(838 54)">
        <rect width="370" height="104" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="185" y="65" text-anchor="middle" font-size="43" font-weight="900" fill="#ffffff">−40°C = −40°F</text>
      </g>
    </g>

    <g transform="translate(136 920)">
      <rect width="1168" height="184" rx="24" fill="#071011" stroke="#ffffff" stroke-opacity="0.16"/>
      <path d="M120 118H1048" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
      <path d="M-40 182L352 130L1260 8" fill="none" stroke="url(#lime)" stroke-width="7" stroke-linecap="round"/>
      <path d="M252 184L352 130L610 -10" fill="none" stroke="url(#cyan)" stroke-width="7" stroke-linecap="round"/>
      <circle cx="352" cy="130" r="14" fill="#ffffff" filter="url(#glow)"/>
      <line x1="352" y1="130" x2="352" y2="150" stroke="#ffffff" stroke-width="2" stroke-dasharray="7 8" opacity="0.65"/>
      <text x="90" y="44" font-size="22" font-weight="900" fill="#91c83e">same-number line</text>
      <text x="802" y="44" font-size="22" font-weight="900" fill="#74e8ff">F = 9/5C + 32</text>
      <text x="352" y="168" text-anchor="middle" font-size="24" font-weight="900" fill="#ffffff">one meeting point: −40</text>
    </g>
  </g>
</svg>
