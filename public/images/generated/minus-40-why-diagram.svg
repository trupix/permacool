<svg width="1280" height="920" viewBox="0 0 1280 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Why Celsius and Fahrenheit meet at minus forty</title>
  <desc id="desc">A three-part diagram showing the different degree size, the 32 degree offset at water's freezing point, and the equation that produces the single crossing at negative forty.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071113"/>
      <stop offset="0.54" stop-color="#122629"/>
      <stop offset="1" stop-color="#111c16"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86efff"/>
      <stop offset="1" stop-color="#13a7c7"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efc85d"/>
      <stop offset="1" stop-color="#91c83e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1280" height="920" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#ffffff">
    <path d="M0 120H1280M0 280H1280M0 440H1280M0 600H1280M0 760H1280"/>
    <path d="M160 0V920M320 0V920M480 0V920M640 0V920M800 0V920M960 0V920M1120 0V920"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="58" font-size="17" font-weight="900" letter-spacing="4" fill="#84edfd">WHY THIS HAPPENS</text>
    <text x="60" y="105" font-size="34" font-weight="900" fill="#ffffff">Different degree size. Different zero point. One exact crossing.</text>

    <g transform="translate(60 145)">
      <rect width="360" height="430" rx="8" fill="#071113" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.16"/>
      <path d="M0 0H360V6H0Z" fill="url(#cyan)"/>
      <text x="28" y="48" font-size="15" font-weight="900" letter-spacing="3" fill="#84edfd">01  SCALE SIZE</text>
      <text x="28" y="95" font-size="31" font-weight="900" fill="#ffffff">The degree steps</text>
      <text x="28" y="130" font-size="31" font-weight="900" fill="#ffffff">are different.</text>
      <text x="28" y="170" font-size="18" font-weight="800" fill="#aebfbd">A Celsius degree equals</text>
      <text x="28" y="196" font-size="18" font-weight="800" fill="#aebfbd">1.8 Fahrenheit degrees.</text>

      <g transform="translate(28 220)">
        <text x="0" y="17" font-size="16" font-weight="900" fill="#aeeffa">1&#176;C</text>
        <rect x="0" y="30" width="304" height="42" rx="6" fill="#13a7c7" fill-opacity="0.18" stroke="#74e8ff" stroke-width="2"/>
        <path d="M15 51H289" stroke="url(#cyan)" stroke-width="9" stroke-linecap="round"/>

        <text x="0" y="108" font-size="16" font-weight="900" fill="#e5efc9">1.8&#176;F</text>
        <rect x="0" y="121" width="304" height="42" rx="6" fill="#91c83e" fill-opacity="0.14" stroke="#a8d65c" stroke-width="2"/>
        <path d="M15 142H289" stroke="url(#lime)" stroke-width="9" stroke-linecap="round"/>
        <path d="M168 125V159" stroke="#ffffff" stroke-opacity="0.42" stroke-width="2" stroke-dasharray="4 4"/>
        <text x="91" y="148" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">1&#176;F</text>
        <text x="236" y="148" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">0.8&#176;F</text>
      </g>

      <text x="28" y="407" font-size="16" font-weight="800" fill="#9cadab">Same temperature step, different count.</text>
    </g>

    <g transform="translate(460 145)">
      <rect width="360" height="430" rx="8" fill="#071113" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect width="360" height="6" fill="url(#lime)"/>
      <text x="28" y="48" font-size="15" font-weight="900" letter-spacing="3" fill="#dce98e">02  OFFSET</text>
      <text x="28" y="95" font-size="31" font-weight="900" fill="#ffffff">The zero points</text>
      <text x="28" y="130" font-size="31" font-weight="900" fill="#ffffff">do not line up.</text>
      <text x="28" y="170" font-size="18" font-weight="800" fill="#aebfbd">The scales start 32 units apart</text>
      <text x="28" y="196" font-size="18" font-weight="800" fill="#aebfbd">at water's freezing point.</text>

      <g transform="translate(37 230)">
        <rect x="0" y="0" width="286" height="132" rx="8" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.16"/>
        <path d="M40 66H246" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 7"/>
        <circle cx="74" cy="66" r="28" fill="#13a7c7" fill-opacity="0.22" stroke="#74e8ff" stroke-width="3"/>
        <circle cx="212" cy="66" r="28" fill="#91c83e" fill-opacity="0.2" stroke="#a8d65c" stroke-width="3"/>
        <text x="74" y="74" text-anchor="middle" font-size="20" font-weight="900" fill="#ffffff">0&#176;C</text>
        <text x="212" y="74" text-anchor="middle" font-size="20" font-weight="900" fill="#ffffff">32&#176;F</text>
        <text x="143" y="116" text-anchor="middle" font-size="14" font-weight="900" letter-spacing="2" fill="#aebfbd">SAME WATER</text>
      </g>

      <g transform="translate(28 386)">
        <text x="0" y="0" font-size="16" font-weight="800" fill="#9cadab">One physical temperature.</text>
        <text x="0" y="24" font-size="16" font-weight="800" fill="#9cadab">Two different starting numbers.</text>
      </g>
    </g>

    <g transform="translate(860 145)">
      <rect width="360" height="430" rx="8" fill="#071113" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect width="360" height="6" fill="#ffffff"/>
      <text x="28" y="48" font-size="15" font-weight="900" letter-spacing="3" fill="#ffffff">03  THE CONVERGENCE</text>
      <text x="28" y="95" font-size="31" font-weight="900" fill="#ffffff">Different starts.</text>
      <text x="28" y="130" font-size="31" font-weight="900" fill="#ffffff">Different speeds.</text>
      <text x="28" y="170" font-size="18" font-weight="800" fill="#aebfbd">Fahrenheit grows faster as</text>
      <text x="28" y="196" font-size="18" font-weight="800" fill="#aebfbd">temperatures rise, so the lines</text>
      <text x="28" y="222" font-size="18" font-weight="800" fill="#aebfbd">meet once in the negatives.</text>

      <g transform="translate(34 255)">
        <rect width="292" height="124" rx="8" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.14"/>
        <path d="M22 102H270M42 112V18" stroke="#ffffff" stroke-opacity="0.26" stroke-width="2"/>
        <path d="M18 103L270 42" fill="none" stroke="#74e8ff" stroke-width="6" stroke-linecap="round"/>
        <path d="M72 112L130 74L218 17" fill="none" stroke="#a8d65c" stroke-width="6" stroke-linecap="round"/>
        <circle cx="130" cy="74" r="8" fill="#ffffff" filter="url(#glow)"/>
        <text x="143" y="101" font-size="14" font-weight="900" fill="#ffffff">&#8722;40</text>
      </g>

      <text x="28" y="407" font-size="16" font-weight="800" fill="#9cadab">Two straight lines. One meeting point.</text>
    </g>

    <g transform="translate(60 615)">
      <rect width="1160" height="245" rx="8" fill="#050b0c" stroke="#ffffff" stroke-opacity="0.17"/>
      <text x="32" y="39" font-size="15" font-weight="900" letter-spacing="3" fill="#84edfd">SET THE READINGS EQUAL</text>

      <g transform="translate(40 70)" font-size="25" font-weight="900">
        <text x="0" y="0" fill="#ffffff">F = C</text>
        <text x="0" y="43" fill="#ffffff">C = 1.8C + 32</text>
        <text x="0" y="86" fill="#ffffff">&#8722;0.8C = 32</text>
        <text x="0" y="129" fill="#74e8ff">C = &#8722;40</text>
      </g>

      <path d="M380 128H690" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4" stroke-dasharray="9 10" marker-end="url(#arrow)"/>
      <text x="535" y="109" text-anchor="middle" font-size="15" font-weight="900" letter-spacing="2" fill="#aebfbd">SOLVE THE ONLY INTERSECTION</text>

      <g transform="translate(742 36)">
        <rect width="378" height="174" rx="8" fill="#10282a" stroke="#74e8ff" stroke-opacity="0.55" stroke-width="3"/>
        <text x="189" y="44" text-anchor="middle" font-size="15" font-weight="900" letter-spacing="3" fill="#aebfbd">THE COLD HANDSHAKE</text>
        <text x="189" y="113" text-anchor="middle" font-size="48" font-weight="900" fill="#ffffff">
          <tspan fill="#74e8ff">&#8722;40&#176;C</tspan>
          <tspan fill="#ffffff"> = </tspan>
          <tspan fill="#a8d65c">&#8722;40&#176;F</tspan>
        </text>
        <text x="189" y="148" text-anchor="middle" font-size="16" font-weight="900" fill="#d9e6e3">Exact, unique, and not a rounding trick.</text>
      </g>
    </g>
  </g>
</svg>
