<svg width="1440" height="840" viewBox="0 0 1440 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Temperature conversion curves crossing at minus forty</title>
  <desc id="desc">A chart showing the Fahrenheit conversion line and the same-number Celsius line meeting at negative forty.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1415"/>
      <stop offset="1" stop-color="#172321"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1440" height="840" fill="#f7fbfa"/>
  <rect x="64" y="54" width="1312" height="734" rx="28" fill="url(#panel)"/>
  <path d="M1036 92H1294M1004 126H1262M972 160H1230" stroke="#13a7c7" stroke-width="2" stroke-opacity="0.2"/>
  <path d="M118 612H376M148 646H406M178 680H436" stroke="#91c83e" stroke-width="2" stroke-opacity="0.18"/>
  <g transform="translate(170 104)">
    <rect width="1100" height="520" rx="18" fill="#071011" opacity="0.42" stroke="#ffffff" stroke-opacity="0.13"/>
    <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="1">
      <path d="M0 432H1100M0 346H1100M0 260H1100M0 174H1100M0 88H1100"/>
      <path d="M183 0V520M367 0V520M550 0V520M733 0V520M917 0V520"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#aebcba">
      <text x="-46" y="438">-80</text>
      <text x="-46" y="352">-40</text>
      <text x="-22" y="266">0</text>
      <text x="-32" y="180">40</text>
      <text x="-32" y="94">80</text>
      <text x="0" y="558" text-anchor="middle">-80</text>
      <text x="183" y="558" text-anchor="middle">-40</text>
      <text x="367" y="558" text-anchor="middle">0</text>
      <text x="550" y="558" text-anchor="middle">40</text>
      <text x="733" y="558" text-anchor="middle">80</text>
      <text x="917" y="558" text-anchor="middle">120</text>
    </g>
    <path d="M0 432L183 346L367 260L550 174L733 88L1100 -84" fill="none" stroke="#91c83e" stroke-width="8" stroke-linecap="round" opacity="0.95" filter="url(#softGlow)"/>
    <path d="M0 502L183 346L367 190L550 34L733 -122L1100 -434" fill="none" stroke="#70e5fb" stroke-width="8" stroke-linecap="round" opacity="0.95" filter="url(#softGlow)"/>
    <circle cx="183" cy="346" r="16" fill="#fff"/>
    <circle cx="183" cy="346" r="48" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.58"/>
    <line x1="183" y1="346" x2="183" y2="520" stroke="#ffffff" stroke-width="2" stroke-dasharray="7 8" opacity="0.55"/>
    <line x1="0" y1="346" x2="183" y2="346" stroke="#ffffff" stroke-width="2" stroke-dasharray="7 8" opacity="0.55"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="214" y="284" font-size="28" font-weight="900" fill="#ffffff">same reading</text>
      <text x="214" y="360" font-size="54" font-weight="900" fill="#ffffff">-40°C = -40°F</text>
      <text x="760" y="92" font-size="28" font-weight="900" fill="#70e5fb">F = 9/5C + 32</text>
      <text x="770" y="136" font-size="22" font-weight="800" fill="#d4eeef">Fahrenheit conversion line</text>
      <text x="716" y="246" font-size="28" font-weight="900" fill="#91c83e">F = C</text>
      <text x="716" y="288" font-size="22" font-weight="800" fill="#dbe9da">same-number line</text>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="100" font-size="24" font-weight="900" fill="#78e4f4">Temperature curve visual</text>
    <text x="96" y="728" font-size="26" font-weight="900" fill="#ffffff">X-axis: Celsius input. Y-axis: Fahrenheit reading.</text>
    <text x="96" y="760" font-size="21" font-weight="700" fill="#b8c8c5">The two lines cross once because Fahrenheit uses a different zero point and a different degree size.</text>
  </g>
</svg>
