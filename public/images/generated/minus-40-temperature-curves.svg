<svg width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Celsius and Fahrenheit conversion lines cross at minus forty</title>
  <desc id="desc">An accurately plotted chart with Celsius input on the horizontal axis and scale reading on the vertical axis. The Celsius and Fahrenheit lines cross once at negative forty.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061012"/>
      <stop offset="0.58" stop-color="#102326"/>
      <stop offset="1" stop-color="#111c17"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#85efff"/>
      <stop offset="1" stop-color="#13a7c7"/>
    </linearGradient>
    <linearGradient id="limeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0c85e"/>
      <stop offset="1" stop-color="#91c83e"/>
    </linearGradient>
    <filter id="pointGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <path d="M0 0H1280V9H0Z" fill="url(#cyanLine)"/>
  <path d="M640 0H1280V9H640Z" fill="url(#limeLine)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="51" font-size="17" font-weight="900" letter-spacing="4" fill="#85efff">THE TEMPERATURE CURVES</text>
    <text x="70" y="92" font-size="35" font-weight="900" fill="#ffffff">One crossing.</text>
    <text x="70" y="126" font-size="26" font-weight="900" fill="#d9e6e3">No rounding. No second meeting point.</text>

    <g transform="translate(694 27)">
      <rect width="516" height="105" rx="8" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.15"/>
      <path d="M24 32H82" stroke="#74e8ff" stroke-width="7" stroke-linecap="round"/>
      <text x="100" y="39" font-size="18" font-weight="900" fill="#d9f7fb">Celsius reading: C = C</text>
      <path d="M24 75H82" stroke="#a8d65c" stroke-width="7" stroke-linecap="round"/>
      <text x="100" y="82" font-size="18" font-weight="900" fill="#edf6db">Fahrenheit reading: F = 1.8C + 32</text>
    </g>

    <g>
      <rect x="170" y="160" width="980" height="490" rx="8" fill="#020708" fill-opacity="0.42" stroke="#ffffff" stroke-opacity="0.13"/>

      <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
        <path d="M170 160H1150M170 221.25H1150M170 282.5H1150M170 343.75H1150M170 405H1150M170 466.25H1150M170 527.5H1150M170 588.75H1150M170 650H1150"/>
        <path d="M170 160V650M292.5 160V650M415 160V650M537.5 160V650M660 160V650M782.5 160V650M905 160V650M1027.5 160V650M1150 160V650"/>
      </g>

      <g font-size="17" font-weight="800" fill="#aebfbd">
        <text x="143" y="166" text-anchor="end">160</text>
        <text x="143" y="227" text-anchor="end">120</text>
        <text x="143" y="288" text-anchor="end">80</text>
        <text x="143" y="349" text-anchor="end">40</text>
        <text x="143" y="411" text-anchor="end">0</text>
        <text x="143" y="472" text-anchor="end">-40</text>
        <text x="143" y="533" text-anchor="end">-80</text>
        <text x="143" y="594" text-anchor="end">-120</text>
        <text x="143" y="656" text-anchor="end">-160</text>

        <text x="170" y="686" text-anchor="middle">-100</text>
        <text x="292.5" y="686" text-anchor="middle">-80</text>
        <text x="415" y="686" text-anchor="middle">-60</text>
        <text x="537.5" y="686" text-anchor="middle" fill="#ffffff" font-weight="900">-40</text>
        <text x="660" y="686" text-anchor="middle">-20</text>
        <text x="782.5" y="686" text-anchor="middle">0</text>
        <text x="905" y="686" text-anchor="middle">20</text>
        <text x="1027.5" y="686" text-anchor="middle">40</text>
        <text x="1150" y="686" text-anchor="middle">60</text>
      </g>

      <path d="M170 558.125L1150 313.125" fill="none" stroke="url(#cyanLine)" stroke-width="8" stroke-linecap="round"/>
      <path d="M170 631.625L1150 190.625" fill="none" stroke="url(#limeLine)" stroke-width="8" stroke-linecap="round"/>

      <path d="M537.5 466.25V650M170 466.25H537.5" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="8 9"/>
      <circle cx="537.5" cy="466.25" r="27" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="2" filter="url(#pointGlow)"/>
      <circle cx="537.5" cy="466.25" r="9" fill="#ffffff"/>

      <g transform="translate(282 313)">
        <rect width="510" height="114" rx="8" fill="#071113" stroke="#ffffff" stroke-opacity="0.32"/>
        <text x="255" y="34" text-anchor="middle" font-size="15" font-weight="900" letter-spacing="3" fill="#a9bcba">THE ONE SHARED READING</text>
        <text x="255" y="83" text-anchor="middle" font-size="43" font-weight="900" fill="#ffffff">
          <tspan fill="#74e8ff">&#8722;40&#176;C</tspan>
          <tspan fill="#ffffff"> = </tspan>
          <tspan fill="#a8d65c">&#8722;40&#176;F</tspan>
        </text>
      </g>

      <path d="M537.5 427V446" stroke="#ffffff" stroke-width="2"/>
    </g>

    <text x="660" y="739" text-anchor="middle" font-size="20" font-weight="900" fill="#ffffff">Celsius input (&#176;C)</text>
    <text x="58" y="405" text-anchor="middle" font-size="20" font-weight="900" fill="#ffffff" transform="rotate(-90 58 405)">Scale reading</text>
    <text x="660" y="773" text-anchor="middle" font-size="16" font-weight="800" fill="#9eb0ae">Straight lines with different slopes can cross once. Here, that exact point is &#8722;40.</text>
  </g>
</svg>
